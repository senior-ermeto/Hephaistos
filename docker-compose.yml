services:
  db:
    image: postgres:16-alpine
    container_name: hephaistos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hephaistos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hephaistos_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-hephaistos_db}
      TZ: Europe/Paris
    volumes:
      - hephaistos_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hephaistos} -d ${POSTGRES_DB:-hephaistos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hephaistos_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hephaistos_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hephaistos}:${POSTGRES_PASSWORD:-hephaistos_secret_password}@db:5432/${POSTGRES_DB:-hephaistos_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_hephaistos_ermeto_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin123}
      FIRST_ADMIN_FIRSTNAME: ${FIRST_ADMIN_FIRSTNAME:-Administrateur}
      FIRST_ADMIN_LASTNAME: ${FIRST_ADMIN_LASTNAME:-Ermeto}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      TZ: Europe/Paris
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - hephaistos_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hephaistos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - hephaistos_net

volumes:
  hephaistos_pgdata:
    name: hephaistos_pgdata

networks:
  hephaistos_net:
    name: hephaistos_net
    driver: bridge
