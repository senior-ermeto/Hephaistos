name: Héphaïstos CI & Build APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-check:
    name: Vérification Backend FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test FastAPI Startup & Healthcheck
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              r = client.get('/api/health')
              assert r.status_code == 200
              r_mach = client.get('/api/machines')
              assert r_mach.status_code == 200
              r_week = client.get('/api/analytics/weekly')
              assert r_week.status_code == 200
              print('Backend tests passed!')
          "

  frontend-build:
    name: Build Frontend React + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy Logos
        working-directory: .
        run: |
          mkdir -p frontend/public/logo
          cp -r logo/* frontend/public/logo/
      - name: Install & Build React App
        run: |
          npm install
          npm run build

  android-apk:
    name: Build APK Android (Tablette)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-android
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hephaistos-ermeto-android-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
